    get:
      operationId: getTimetable
      tags: [lessons]
      summary: The team timetable, one column per tutor
      description: |
        Needs `view_team_timetable`. Every current owner and teacher gets a
        column, with or without lessons, so free time is visible. A lesson
        with several tutors appears in each of their columns.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: At most 7 days after `from`.
          schema:
            type: string
            format: date-time
        - name: teacherIds
          in: query
          description: Only these tutors' columns.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: The timetable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timetable"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

