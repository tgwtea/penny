  /v1/calendar/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The secret part of a calendar link.
        schema:
          type: string
          maxLength: 100
    get:
      operationId: getCalendarFeed
      tags: [lessons]
      summary: A tutor's lessons as an iCalendar feed
      description: |
        Public: the unguessable link is the credential. Lessons from 30 days
        ago to 180 days ahead, with students' first names and the place only,
        never notes or contacts.
      security: []
      responses:
        "200":
          description: An RFC 5545 calendar.
          content:
            text/calendar:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/unsubscribe/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The signed token from an email's unsubscribe link.
        schema:
          type: string
          maxLength: 500
    get:
      operationId: describeUnsubscribe
      tags: [notifications]
      summary: Say what an unsubscribe link would stop, without stopping it
      description: |
        Public: the signed link is the credential. Opening a link changes
        nothing, so mail scanners that follow links cannot unsubscribe
        anyone; the page asks, then POSTs.
      security: []
      responses:
        "200":
          description: What the link stops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unsubscribe"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: unsubscribe
      tags: [notifications]
      summary: Stop one kind of email for one contact
      description: |
        Public, and also the RFC 8058 one-click target in each email's
        List-Unsubscribe header. Receipts cannot be stopped: they are the
        record of a payment.
      security: []
      requestBody:
        description: Mail apps' one-click form (`List-Unsubscribe=One-Click`). Ignored.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe:
                  type: string
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unsubscribe"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

