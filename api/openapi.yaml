  /v1/workspaces/{workspaceId}/series:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createSeries
      tags: [lessons]
      summary: Book a recurring lesson
      description: |
        Needs `manage_lessons`. A series is a rule (RFC 5545, evaluated in the
        team's timezone) plus the lesson it repeats. Every occurrence is its
        own lesson, booked ahead over a rolling horizon of 12 weeks, so each
        can carry its own notes, attendance and payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesInput"
      responses:
        "201":
          description: The new series, its first lessons already booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/series/{seriesId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SeriesId"
    get:
      operationId: getSeries
      tags: [lessons]
      summary: Get a recurring lesson
      description: For owners, and for tutors on the series.
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSeries
      tags: [lessons]
      summary: Change a recurring lesson from a date onwards
      description: |
        Needs `manage_lessons`; changing tutors also needs
        `reassign_lessons`. The change applies to scheduled lessons on and
        after `from` ("this and following"; send today for "all future
        lessons"). Earlier lessons, and lessons that are done or cancelled,
        are never rewritten. To change one lesson only, change the lesson.
        Send the series' `version` in `If-Match`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesChanges"
      responses:
        "200":
          description: |
            The series as it is from `from` on. When the change starts after
            the series did, the series is split and this is the new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/series/{seriesId}/end:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SeriesId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      operationId: endSeries
      tags: [lessons]
      summary: Stop a recurring lesson after a date
      description: |
        Needs `manage_lessons`. Scheduled lessons after `after` are removed;
        lessons that are done, cancelled or have notes on them stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSeriesRequest"
      responses:
        "200":
          description: The ended series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/timetable:
    parameters:
