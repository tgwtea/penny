      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getPayeeAccount
      tags: [payments]
      summary: Where a tutor receives PayNow
      description: The tutor themselves, or an owner.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeAccount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setPayeeAccount
      tags: [payments]
      summary: Set where a tutor receives PayNow
      description: |
        The tutor themselves, or an owner. Changing the proxy clears
        `verified`: the tutor scans the new test code before any parent sees it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeeAccountInput"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeAccount"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/members/{memberId}/payee-account/verify:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: verifyPayeeAccount
      tags: [payments]
      summary: Confirm the test code showed the right recipient
      description: |
        The tutor scanned `testPayload` in their own banking app and saw their
        registered name. Only verified accounts can receive payment requests.
      responses:
        "200":
          description: The verified account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayeeAccount"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/billable-lessons:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listBillableLessons
      tags: [payments]
      summary: Billable lessons not yet on a payment request
      description: |
        Done lessons, and no-shows and late cancellations the lead tutor's
        policy bills, that no open or paid request covers. Owners see every
        payee's; teachers only lessons they lead.
      parameters:
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
        - name: payeeId
          in: query
          description: Only lessons this membership leads.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lessons, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillableLessonList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/payment-requests:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listPaymentRequests
      tags: [payments]
      summary: List payment requests
      description: Owners see every request; teachers those they are the payee of.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentRequestStatus"
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Requests, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPaymentRequest
      tags: [payments]
      summary: Ask for payment
      description: |
        Owners for any payee, teachers for themselves (ADR 024). The payee
        needs a verified PayNow account. Lesson lines take the lesson's fee and
        must be billable and led by the payee (ADR 018). If the payee sends
        automatically, the request is sent at once; otherwise it is a draft.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestInput"
      responses:
        "201":
          description: The request, and its link if it was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestWithLink"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/payment-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getPaymentRequest
      tags: [payments]
      summary: Get a payment request with what it covers and its confirmations
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/payment-requests/{requestId}/send:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: sendPaymentRequest
      tags: [payments]
      summary: Send a draft, or send an open request again
      description: |
        Emails the student's billing contacts a fresh link. Any earlier link
        stops working: Penny keeps only a hash of the current one.
      responses:
        "200":
          description: The request and its new link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestWithLink"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/payment-requests/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: cancelPaymentRequest
      tags: [payments]
      summary: Withdraw a request that is not paid
      description: Its link stops working and its lessons can be billed again.
      responses:
        "200":
          description: The cancelled request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/payment-requests/{requestId}/payment:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: recordPayment
      tags: [payments]
      summary: Confirm the money arrived
      description: |
        The payee, or an owner, records what their bank shows. When the parent
        has confirmed too, the request is paid and the receipt is issued and
        emailed (ADR 024).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: The request with its payment, and its receipt if both have confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/receipts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listReceipts
      tags: [payments]
      summary: List receipts
      description: Owners see every receipt; teachers those they issued as payee.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Receipts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/receipts/{receiptId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReceiptId"
    get:
      operationId: getReceipt
      tags: [payments]
      summary: Get a receipt and everything it traces back to
      responses:
        "200":
          description: The receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/receipts/{receiptId}/pdf:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReceiptId"
    get:
      operationId: getReceiptPdf
      tags: [payments]
      summary: The receipt as a PDF
      description: |
        Rendered the same way every time from the receipt's record; its SHA-256
        matches the receipt's `contentSha256`, so a copy can be shown to be
        unaltered.
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/receipts/{receiptId}/void:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReceiptId"
    post:
      operationId: voidReceipt
      tags: [payments]
      summary: Void a receipt, optionally issuing a corrected one
      description: |
        The payee or an owner. Receipts are never edited: a correction voids
        this one with a reason and issues a new one that references it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidReceiptInput"
      responses:
        "200":
          description: The voided receipt, with `replacedByReceiptId` if a correction was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/family/students:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listFamilyStudents
      tags: [family]
      summary: The students a family account is linked to
      description: A student sees themselves; a parent sees their children in the team.
      responses:
        "200":
          description: The students.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStudentList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/family/lessons:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listFamilyLessons
      tags: [family]
      summary: The linked students' lessons in a range
      description: |
        Read-only. Other students in a group lesson are counted, not named,
        and only items meant for the caller are included (ADR 025).
      parameters:
        - name: from
          in: query
          required: true
          description: Lessons ending after this instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Lessons starting before this instant. At most 62 days after `from`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The lessons, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyLessonList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/family/payment-requests:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listFamilyPaymentRequests
      tags: [family]
      summary: A parent's open and paid payment requests
      description: |
        What each request's payment page shows, with its PayNow code while
        open, for the parent's children. Newest first.
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyPaymentRequestList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/family/payment-requests/{requestId}/paid:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: confirmFamilyPayment
      tags: [family]
      summary: Say "I've paid" as a signed-in parent
      description: The payer's confirmation (ADR 024), exactly as the payment page records it.
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyPaymentRequest"
        "409":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/family/receipts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listFamilyReceipts
      tags: [family]
      summary: A parent's receipts, newest first
      responses:
        "200":
          description: The receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/workspaces/{workspaceId}/family/receipts/{receiptId}/pdf:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReceiptId"
    get:
      operationId: getFamilyReceiptPdf
      tags: [family]
      summary: One of a parent's receipts as a PDF
      responses:
        "200":
          description: The PDF, the same bytes as the team's copy.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/pay/{token}:
    parameters:
      - $ref: "#/components/parameters/PayToken"
    get:
      operationId: getPublicPaymentRequest
      tags: [payments]
      summary: The public payment page's data
      description: |
        Anyone with the link. Shows the payee, what is owed and the PayNow
        code, and no more about the student than a first name.
      security: []
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentRequest"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/pay/{token}/paid:
    parameters:
      - $ref: "#/components/parameters/PayToken"
    post:
      operationId: confirmPaidByPayer
      tags: [payments]
      summary: The payer says they have paid
      description: |
        Records the parent's confirmation and tells the payee. When the payee
        has confirmed the money too, the request is paid and the receipt is
        issued (ADR 024).
      security: []
      responses:
        "200":
          description: The request as the payer now sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentRequest"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Firebase Auth ID token for the signed-in person.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The team. Everything under it belongs to that team.
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      description: A membership in the team.
      schema:
        type: string
        format: uuid

    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayToken:
      name: token
      in: path
      required: true
      description: The secret part of a payment link.
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique value per intended change, such as a UUID made when the form
        opened. Retrying with the same key returns the first result instead of
        doing it twice.
      schema:
        type: string
        minLength: 8
        maxLength: 100
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: The most items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The lesson's `version` as last read, such as `"3"`. A lesson changed
        since is refused with 412, so nobody overwrites a change they have
        not seen.
      schema:
        type: string

  responses:
    Problem:
      description: The request failed. The body says why.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem. Clients branch on `type`, never on `title` or
        `detail`, which are for people and may change.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A stable identifier for this kind of problem.
          example: urn:penny:problem:not-found
        title:
          type: string
          description: A short summary of this kind of problem.
          example: Not found
        status:
          type: integer
          format: int32
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          description: What went wrong in this occurrence.
        instance:
          type: string
          description: The request path that produced the problem.
        requestId:
          type: string
          description: Quote this when reporting the problem.

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          description: One entry per dependency checked. Empty for liveness.
          items:
            $ref: "#/components/schemas/HealthCheck"

    HealthStatus:
      type: string
      enum: [ok, failing]

    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: database
        status:
          $ref: "#/components/schemas/HealthStatus"
        detail:
          type: string
          description: Why the check failed. Never contains secrets.

    ServerVersion:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
          description: The release version, or "dev" for a local build.
          example: 0.1.0
        commit:
          type: string
          description: The git commit the server was built from, or "unknown".
          example: 3f2c1a9

    Me:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          description: Every team the person belongs to. Empty before onboarding.
          items:
            $ref: "#/components/schemas/Membership"

    UpdateMeRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: The name shown to the person's teams.
          example: Daniel Koh

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string

    Membership:
      type: object
      required: [id, workspace, role, capabilities]
      properties:
        id:
          type: string
          format: uuid
        workspace:
          $ref: "#/components/schemas/Workspace"
        role:
          $ref: "#/components/schemas/MembershipRole"
        capabilities:
          type: array
          description: |
            What this person may do in this team. Clients show or hide
            controls from this list and never compare role names.
          items:
            $ref: "#/components/schemas/Capability"

    Workspace:
      type: object
      description: A team. The UI says "Team"; the API says workspace.
      required: [id, name, timezone, memberCount, reminderHours]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Koh Guitar Studio
        timezone:
          type: string
          description: An IANA timezone name. Lessons are shown in this timezone.
          example: Asia/Singapore
        memberCount:
          type: integer
          format: int32
          description: Active members. A team of one hides team features.
          example: 8
        reminderHours:
          type: integer
          format: int32
          description: How long before a lesson its contacts are reminded. 0 sends no reminders.
          example: 24

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The team's name, shown to parents on payment requests and receipts.
          example: Koh Guitar Studio
        timezone:
          type: string
          description: An IANA timezone name. Defaults to Asia/Singapore.
          example: Asia/Singapore

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          description: An IANA timezone name.
        reminderHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 168
          description: How long before a lesson to remind its contacts. 0 turns reminders off.

    MemberStatus:
      type: string
      description: |
        `invited` until someone signs in with the member's email address.
        Removed members are not listed.
      enum: [active, invited]

    Member:
      type: object
      description: A person in a team, as the team list shows them.
      required: [id, displayName, email, role, status]
      properties:
        id:
          type: string
          format: uuid
          description: The membership ID. Lessons point at memberships.
        displayName:
          type: string
          example: Mei Lin Tan
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        joinedAt:
          type: string
          format: date-time
          description: When they became active. Absent while invited.

    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.

    AddMemberRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Their name as the team will see it until they sign in.
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MembershipRole"

    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"

    MemberRef:
      type: object
      description: A team member, as other records mention them.
      required: [membershipId, displayName]
      properties:
        membershipId:
          type: string
          format: uuid
        displayName:
          type: string

    StudentSummary:
      type: object
      required: [id, name, archived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Arjun Nair
        primaryTeacher:
          $ref: "#/components/schemas/MemberRef"
        archived:
          type: boolean

    StudentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentSummary"
        nextCursor:
          type: string

    Student:
      type: object
      required: [id, name, archived, contacts, goals]
      properties:
        signInEmail:
          type: string
          description: Where the student was given their own account (ADR 025).
        signedIn:
          type: boolean
          description: The student has signed in with that account.
        id:
          type: string
          format: uuid
        name:
          type: string
        primaryTeacher:
          $ref: "#/components/schemas/MemberRef"
        notes:
          type: string
          description: Private to the team's staff.
        archived:
          type: boolean
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"

    StudentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        primaryTeacherId:
          type: string
          format: uuid
          description: The membership that usually teaches them.
        notes:
          type: string
          maxLength: 2000
        contacts:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ContactInput"

    StudentChanges:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        primaryTeacherId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 2000
        archived:
          type: boolean

    ContactRelationship:
      type: string
      enum: [parent, guardian, self, other]

    Contact:
      type: object
      description: Someone who gets a student's reminders or receipts.
      required: [id, name, relationship, receivesReminders, receivesBilling]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Priya Nair
        email:
          type: string
          format: email
        phone:
          type: string
          example: "+65 9123 4567"
        relationship:
          $ref: "#/components/schemas/ContactRelationship"
        receivesReminders:
          type: boolean
        receivesBilling:
          type: boolean
        receivesPaymentReminders:
          type: boolean
          description: Reminders about overdue payment requests. Stopped from an email's link.
        canSignIn:
          type: boolean
          description: The owner gave the contact a parent account (ADR 025).
        signedIn:
          type: boolean
          description: The contact has signed in with that account.

    ContactInput:
      type: object
      required: [name, relationship]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        relationship:
          $ref: "#/components/schemas/ContactRelationship"
        receivesReminders:
          type: boolean
          default: true
        receivesBilling:
          type: boolean
          default: true
        receivesPaymentReminders:
          type: boolean
          default: true

    GoalStatus:
      type: string
      enum: [active, achieved, dropped]

    Goal:
      type: object
      description: Something a student works towards over several lessons.
      required: [id, title, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Play Malaguena at 120 bpm
        status:
          $ref: "#/components/schemas/GoalStatus"
        achievedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    GoalInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200

    GoalChanges:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: "#/components/schemas/GoalStatus"

    LocationKind:
      type: string
      enum: [in_person, online]

    Location:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Studio room 2
        kind:
          $ref: "#/components/schemas/LocationKind"
        addressLine1:
          type: string
        addressLine2:
          type: string
        postalCode:
          type: string
          description: A six-digit Singapore postal code.
          example: "238859"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        meetingUrl:
          type: string
          description: For online lessons.

    LocationInput:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/LocationKind"
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: string
          maxLength: 200
        postalCode:
          type: string
          pattern: "^[0-9]{6}$"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        meetingUrl:
          type: string
          maxLength: 500

    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        nextCursor:
          type: string

    LessonStatus:
      type: string
      enum: [scheduled, completed, cancelled, no_show]

    LessonKind:
      type: string
      enum: [regular, makeup, trial]

    TutorRole:
      type: string
      description: The lead tutor bills the lesson (ADR 018).
      enum: [lead, assisting]

    Attendance:
      type: string
      enum: [present, absent, late]

    CancellationParty:
      type: string
      description: Who called the lesson off.
      enum: [tutor, student]

    LessonTutor:
      type: object
      required: [membershipId, displayName, role]
      properties:
        membershipId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/TutorRole"

    LessonStudent:
      type: object
      required: [studentId, name]
      properties:
        studentId:
          type: string
          format: uuid
        name:
          type: string
        attendance:
          $ref: "#/components/schemas/Attendance"

    LessonLocation:
      type: object
      description: Where the lesson is, as it was when booked.
      required: [kind, name]
      properties:
        locationId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LocationKind"
        name:
          type: string
        address:
          type: string
          description: The address on one line, with the postal code.
        meetingUrl:
          type: string

    Cancellation:
      type: object
      required: [at, party, late]
      properties:
        at:
          type: string
          format: date-time
        party:
          $ref: "#/components/schemas/CancellationParty"
        reason:
          type: string
        late:
          type: boolean
          description: Cancelled by the student's side with less notice than the lead tutor's policy asks for.

    Clash:
      type: object
      description: Another non-cancelled lesson overlapping this one for the same tutor or student.
      required: [lessonId, startsAt, endsAt, who]
      properties:
        lessonId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        membershipId:
          type: string
          format: uuid
          description: The tutor booked twice, if it is a tutor.
        studentId:
          type: string
          format: uuid
          description: The student booked twice, if it is a student.
        who:
          type: string
          description: Their name, for "This lesson overlaps Ravi's 16:00 lesson."

    ItemKind:
      type: string
      enum: [task, goal, note]

    ItemVisibility:
      type: string
      description: |
        Who may see the item besides the team's staff: `student` items are
        seen by the signed-in student, `contacts` items by the student and
        their signed-in parents (ADR 025).
      enum: [staff, student, contacts]

    LessonItem:
      type: object
      required: [id, kind, body, visibility, done, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ItemKind"
        body:
          type: string
        visibility:
          $ref: "#/components/schemas/ItemVisibility"
        done:
          type: boolean
          description: Ticked off. Tasks only.
        doneAt:
          type: string
          format: date-time
        goalId:
          type: string
          format: uuid
          description: The student goal this item works towards.
        author:
          $ref: "#/components/schemas/MemberRef"
        createdAt:
          type: string
          format: date-time

    LessonItemInput:
      type: object
      required: [kind, body]
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        body:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          $ref: "#/components/schemas/ItemVisibility"
        goalId:
          type: string
          format: uuid

    LessonItemChanges:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        done:
          type: boolean
        visibility:
          $ref: "#/components/schemas/ItemVisibility"

    CancellationPolicySummary:
      type: object
      description: The lead tutor's policy, as parents see it.
      required: [noticeHours, lateCancellationBillable, noShowBillable, summary]
      properties:
        noticeHours:
          type: integer
          format: int32
        lateCancellationBillable:
          type: boolean
        noShowBillable:
          type: boolean
        summary:
          type: string

    Lesson:
      type: object
      required: [id, startsAt, endsAt, status, kind, tutors, students, feeCents, currency, billable, clashes, version]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/LessonStatus"
        kind:
          $ref: "#/components/schemas/LessonKind"
        title:
          type: string
          example: Guitar, Grade 5
        tutors:
          type: array
          description: The lead first.
          items:
            $ref: "#/components/schemas/LessonTutor"
        students:
          type: array
          items:
            $ref: "#/components/schemas/LessonStudent"
        location:
          $ref: "#/components/schemas/LessonLocation"
        feeCents:
          type: integer
          format: int64
          minimum: 0
          description: The whole lesson's fee, billed by the lead tutor.
        currency:
          type: string
          description: ISO 4217.
          example: SGD
        billable:
          type: boolean
          description: Done, or a no-show or late cancellation the lead tutor's policy bills.
        makeupForLessonId:
          type: string
          format: uuid
        makeupLessonId:
          type: string
          format: uuid
          description: The make-up booked when this lesson was cancelled.
        seriesId:
          type: string
          format: uuid
          description: The recurring lesson this occurrence belongs to.
        cancellation:
          $ref: "#/components/schemas/Cancellation"
        completedAt:
          type: string
          format: date-time
        clashes:
          type: array
          items:
            $ref: "#/components/schemas/Clash"
        items:
          type: array
          description: Tasks, goals and notes. Only when the lesson is fetched on its own.
          items:
            $ref: "#/components/schemas/LessonItem"
        cancellationPolicy:
          $ref: "#/components/schemas/CancellationPolicySummary"
        version:
          type: integer
          format: int32
          description: Send in `If-Match` when changing the lesson.

    LessonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        nextCursor:
          type: string

    TutorInput:
      type: object
      required: [membershipId, role]
      properties:
        membershipId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/TutorRole"

    LessonInput:
      type: object
      required: [startsAt, endsAt, tutors, studentIds]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        tutors:
          type: array
          minItems: 1
          description: Exactly one `lead`.
          items:
            $ref: "#/components/schemas/TutorInput"
        studentIds:
          type: array
          items:
            type: string
            format: uuid
        locationId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        feeCents:
          type: integer
          format: int64
          minimum: 0
        kind:
          $ref: "#/components/schemas/LessonKind"
        makeupForLessonId:
          type: string
          format: uuid

    LessonChanges:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        tutors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TutorInput"
        studentIds:
          type: array
          items:
            type: string
            format: uuid
        locationId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        feeCents:
          type: integer
          format: int64
          minimum: 0

    StudentAttendance:
      type: object
      required: [studentId, attendance]
      properties:
        studentId:
          type: string
          format: uuid
        attendance:
          $ref: "#/components/schemas/Attendance"

    CompleteLessonRequest:
      type: object
      properties:
        attendance:
          type: array
          description: Per student. Students left out are recorded as present.
          items:
            $ref: "#/components/schemas/StudentAttendance"

    MakeupTime:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    CancelLessonRequest:
      type: object
      required: [party]
      properties:
        party:
          $ref: "#/components/schemas/CancellationParty"
        reason:
          type: string
          maxLength: 500
        makeup:
          $ref: "#/components/schemas/MakeupTime"

    HistoryEntry:
      type: object
      required: [action, at]
      properties:
        action:
          type: string
          example: lesson.completed
        at:
          type: string
          format: date-time
        actorName:
          type: string
          description: Absent for changes Penny made itself.
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true

    HistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        nextCursor:
          type: string

    CancellationPolicy:
      type: object
      required: [membershipId, noticeHours, lateCancellationBillable, noShowBillable, summary, isDefault]
      properties:
        membershipId:
          type: string
          format: uuid
        noticeHours:
          type: integer
          format: int32
          description: Cancelling with less notice than this is late.
        lateCancellationBillable:
          type: boolean
        noShowBillable:
          type: boolean
        summary:
          type: string
          description: The policy in the tutor's words, shown to parents.
        isDefault:
          type: boolean
          description: The tutor has not set a policy, so Penny's default applies.

    CancellationPolicyInput:
      type: object
      required: [noticeHours, lateCancellationBillable, noShowBillable]
      properties:
        noticeHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 336
        lateCancellationBillable:
          type: boolean
        noShowBillable:
          type: boolean
        summary:
          type: string
          maxLength: 500

    SeriesInput:
      type: object
      required: [startsOn, startTime, durationMinutes, recurrence, tutors, studentIds]
      properties:
        startsOn:
          type: string
          format: date
          description: The first day, in the team's timezone.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: The wall-clock start, such as "16:00".
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
        recurrence:
          type: string
          maxLength: 200
          description: An RFC 5545 rule without DTSTART, such as FREQ=WEEKLY;BYDAY=TH.
          example: FREQ=WEEKLY;BYDAY=TH
        until:
          type: string
          format: date
          description: The last day lessons may fall on. Open-ended without.
        tutors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TutorInput"
        studentIds:
          type: array
          items:
            type: string
            format: uuid
        locationId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        feeCents:
          type: integer
          format: int64
          minimum: 0

    SeriesChanges:
      type: object
      required: [from]
      properties:
        from:
          type: string
          format: date
          description: The first day the change applies to, in the team's timezone.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
        tutors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TutorInput"
        studentIds:
          type: array
          items:
            type: string
            format: uuid
        locationId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        feeCents:
          type: integer
          format: int64
          minimum: 0

    EndSeriesRequest:
      type: object
      required: [after]
      properties:
        after:
          type: string
          format: date
          description: The last day a lesson of the series stays.

    Series:
      type: object
      required: [id, startsOn, startTime, durationMinutes, recurrence, timezone, tutors, students, feeCents, currency, bookedUntil, version]
      properties:
        id:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        startTime:
          type: string
        durationMinutes:
          type: integer
          format: int32
        recurrence:
          type: string
        timezone:
          type: string
        until:
          type: string
          format: date
        tutors:
          type: array
          items:
            $ref: "#/components/schemas/LessonTutor"
        students:
          type: array
          items:
            $ref: "#/components/schemas/LessonStudent"
        location:
          $ref: "#/components/schemas/LessonLocation"
        title:
          type: string
        feeCents:
          type: integer
          format: int64
        currency:
          type: string
        bookedUntil:
          type: string
          format: date
          description: Lessons exist up to this day; the worker books further ahead.
        version:
          type: integer
          format: int32

    TimetableColumn:
      type: object
      required: [tutor, lessons]
      properties:
        tutor:
          $ref: "#/components/schemas/MemberRef"
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"

    Timetable:
      type: object
      required: [timezone, columns]
      properties:
        timezone:
          type: string
          description: The team's timezone, which the columns' days follow.
        columns:
          type: array
          description: Owners first, then teachers, by name.
          items:
            $ref: "#/components/schemas/TimetableColumn"

    CalendarFeed:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The private link. Treat it like a password.

    EmailCategory:
      type: string
      description: A kind of email a contact may stop. Receipts are not one of them.
      enum: [lesson_reminders, payment_reminders]

    Unsubscribe:
      type: object
      required: [category, teamName, maskedEmail]
      properties:
        category:
          $ref: "#/components/schemas/EmailCategory"
        teamName:
          type: string
          description: Who sends these emails.
        maskedEmail:
          type: string
          description: The address, partly hidden, such as p***@example.com.

    ProxyType:
      type: string
      description: How a PayNow account is addressed.
      enum: [mobile, uen]

    PayeeAccount:
      type: object
      required: [membershipId, proxyType, proxyValue, displayName, sendAutomatically, verified, testPayload]
      properties:
        membershipId:
          type: string
          format: uuid
        proxyType:
          $ref: "#/components/schemas/ProxyType"
        proxyValue:
          type: string
          example: "+6591234567"
        displayName:
          type: string
          description: Shown to payers and in the QR code, at most 25 characters.
        sendAutomatically:
          type: boolean
          description: Send new requests at once instead of keeping them as drafts.
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
        testPayload:
          type: string
          description: A PayNow code with no amount, to scan in the tutor's own banking app.

    PayeeAccountInput:
      type: object
      required: [proxyType, proxyValue, displayName]
      properties:
        proxyType:
          $ref: "#/components/schemas/ProxyType"
        proxyValue:
          type: string
          maxLength: 20
        displayName:
          type: string
          minLength: 1
          maxLength: 25
        sendAutomatically:
          type: boolean
          default: false

    BillableLesson:
      type: object
      required: [lessonId, startsAt, status, students, feeCents, currency, payee]
      properties:
        lessonId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        title:
          type: string
        status:
          $ref: "#/components/schemas/LessonStatus"
        students:
          type: array
          items:
            $ref: "#/components/schemas/LessonStudent"
        feeCents:
          type: integer
          format: int64
        currency:
          type: string
        payee:
          $ref: "#/components/schemas/MemberRef"
        coTaught:
          type: boolean
          description: Several tutors taught it; the lead bills and the split is arranged outside Penny.

    BillableLessonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BillableLesson"
        nextCursor:
          type: string

    PaymentRequestStatus:
      type: string
      enum: [draft, open, paid, cancelled]

    WaitingFor:
      type: string
      description: Who still has to confirm before an open request is paid.
      enum: [both, payee, payer]

    PaymentMethod:
      type: string
      enum: [paynow, bank_transfer, cash, other]

    StudentRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    PaymentRequestSummary:
      type: object
      required: [id, reference, student, payee, amountCents, currency, dueOn, status, overdue, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: PNY-7K3Q9X
        student:
          $ref: "#/components/schemas/StudentRef"
        payee:
          $ref: "#/components/schemas/MemberRef"
        amountCents:
          type: integer
          format: int64
        currency:
          type: string
        dueOn:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/PaymentRequestStatus"
        waitingFor:
          $ref: "#/components/schemas/WaitingFor"
        overdue:
          type: boolean
          description: Open and past its due day in the team's timezone.
        createdAt:
          type: string
          format: date-time

    PaymentRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequestSummary"
        nextCursor:
          type: string

    PaymentRequestLine:
      type: object
      required: [description, amountCents]
      properties:
        lessonId:
          type: string
          format: uuid
        description:
          type: string
          example: Guitar lesson, Thu 19 Nov
        amountCents:
          type: integer
          format: int64

    PaymentRecord:
      type: object
      required: [amountCents, paidOn, method, recordedBy, recordedAt]
      properties:
        amountCents:
          type: integer
          format: int64
        paidOn:
          type: string
          format: date
        method:
          $ref: "#/components/schemas/PaymentMethod"
        recordedBy:
          type: string
          description: Who confirmed it.
        recordedAt:
          type: string
          format: date-time

    ReceiptRef:
      type: object
      required: [id, number, voided]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: R-0042
        voided:
          type: boolean

    PaymentRequest:
      allOf:
        - $ref: "#/components/schemas/PaymentRequestSummary"
        - type: object
          required: [lines, coTaught]
          properties:
            lines:
              type: array
              items:
                $ref: "#/components/schemas/PaymentRequestLine"
            note:
              type: string
            sentAt:
              type: string
              format: date-time
            payerConfirmedAt:
              type: string
              format: date-time
            payment:
              $ref: "#/components/schemas/PaymentRecord"
            receipt:
              $ref: "#/components/schemas/ReceiptRef"
            coTaught:
              type: boolean
              description: A line is a lesson several tutors taught; the payee bills it whole (ADR 018).

    PaymentRequestWithLink:
      type: object
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/PaymentRequest"
        link:
          type: string
          description: The payment page. Shown only now; Penny keeps a hash of it.

    ExtraLine:
      type: object
      required: [description, amountCents]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        amountCents:
          type: integer
          format: int64
          minimum: 1

    PaymentRequestInput:
      type: object
      required: [studentId, payeeId, dueOn]
      properties:
        studentId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        dueOn:
          type: string
          format: date
        lessonIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        extraLines:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExtraLine"
        note:
          type: string
          maxLength: 500

    PaymentInput:
      type: object
      required: [amountCents, paidOn, method]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 1
        paidOn:
          type: string
          format: date
        method:
          $ref: "#/components/schemas/PaymentMethod"

    Voided:
      type: object
      required: [at, reason, by]
      properties:
        at:
          type: string
          format: date-time
        reason:
          type: string
        by:
          type: string

    Receipt:
      type: object
      required: [id, number, issuedAt, amountCents, currency, paidOn, method, payee, student, request, lines, contentSha256]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Sequential and gapless within the team.
          example: R-0042
        issuedAt:
          type: string
          format: date-time
        amountCents:
          type: integer
          format: int64
        currency:
          type: string
        paidOn:
          type: string
          format: date
        method:
          $ref: "#/components/schemas/PaymentMethod"
        payee:
          $ref: "#/components/schemas/MemberRef"
        student:
          $ref: "#/components/schemas/StudentRef"
        request:
          type: object
          required: [id, reference]
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequestLine"
        contentSha256:
          type: string
          description: Hex SHA-256 of the receipt's PDF.
        voided:
          $ref: "#/components/schemas/Voided"
        replacesReceiptId:
          type: string
          format: uuid
        replacedByReceiptId:
          type: string
          format: uuid

    ReceiptSummary:
      type: object
      required: [id, number, issuedAt, amountCents, currency, student, payee, voided]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        issuedAt:
          type: string
          format: date-time
        amountCents:
          type: integer
          format: int64
        currency:
          type: string
        student:
          $ref: "#/components/schemas/StudentRef"
        payee:
          $ref: "#/components/schemas/MemberRef"
        voided:
          type: boolean

    ReceiptList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptSummary"
        nextCursor:
          type: string

    VoidReceiptInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        correction:
          $ref: "#/components/schemas/PaymentInput"

    PublicPaymentLine:
      type: object
      required: [description, amountCents]
      properties:
        description:
          type: string
        amountCents:
          type: integer
          format: int64

    PublicPaymentRequest:
      type: object
      required: [teamName, payeeName, studentFirstName, amountCents, currency, reference, dueOn, lines, status, payerConfirmed, coTaught]
      properties:
        teamName:
          type: string
        payeeName:
          type: string
        studentFirstName:
          type: string
        amountCents:
          type: integer
          format: int64
        currency:
          type: string
        reference:
          type: string
        dueOn:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PublicPaymentLine"
        status:
          $ref: "#/components/schemas/PaymentRequestStatus"
        payerConfirmed:
          type: boolean
        paynowPayload:
          type: string
          description: The PayNow QR code's content. Absent once paid or cancelled.
        coTaught:
          type: boolean
        cancellationPolicy:
          type: string
          description: The payee's cancellation policy, in their words.

    PersonalDataExport:
      type: object
      required: [exportedAt, person, teams, actions, actionsTruncated]
      properties:
        exportedAt:
          type: string
          format: date-time
        person:
          type: object
          required: [id, email, displayName, createdAt]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            displayName:
              type: string
            createdAt:
              type: string
              format: date-time
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamDataExport"
        actions:
          type: array
          description: What the person did in Penny, newest first.
          items:
            $ref: "#/components/schemas/RecordedAction"
        actionsTruncated:
          type: boolean
          description: More actions exist than the export lists.

    TeamDataExport:
      type: object
      required: [membershipId, teamId, teamName, role, displayName, email, cancellationPolicies]
      properties:
        membershipId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        displayName:
          type: string
          description: The name the team knows the person by.
        email:
          type: string
        payeeAccount:
          $ref: "#/components/schemas/PayeeAccount"
        cancellationPolicies:
          type: array
          description: Policies the person set; empty while they use the default.
          items:
            $ref: "#/components/schemas/CancellationPolicy"

    RecordedAction:
      type: object
      required: [at, action, entityType, entityId]
      properties:
        at:
          type: string
          format: date-time
        teamId:
          type: string
          format: uuid
        action:
          type: string
          example: lesson.completed
        entityType:
          type: string
          example: lesson
        entityId:
          type: string
          format: uuid

    StudentDataExport:
      type: object
      required: [exportedAt, teamName, student, lessons, paymentRequests, receipts]
      properties:
        exportedAt:
          type: string
          format: date-time
        teamName:
          type: string
        student:
          $ref: "#/components/schemas/Student"
        lessons:
          type: array
          description: Every lesson the student is in, oldest first, with its items.
          items:
            $ref: "#/components/schemas/Lesson"
        paymentRequests:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"

    ContactSignInInput:
      type: object
      required: [canSignIn]
      properties:
        canSignIn:
          type: boolean

    StudentSignInInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    FamilyStudent:
      type: object
      required: [id, name, goals]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"

    FamilyStudentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyStudent"

    FamilyLessonItem:
      type: object
      required: [kind, body, done, createdAt]
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        body:
          type: string
        done:
          type: boolean
        createdAt:
          type: string
          format: date-time

    FamilyLesson:
      type: object
      required: [id, studentIds, otherStudents, startsAt, endsAt, status, tutors, items]
      properties:
        id:
          type: string
          format: uuid
        studentIds:
          type: array
          description: The caller's students in the lesson.
          items:
            type: string
            format: uuid
        otherStudents:
          type: integer
          format: int32
          description: How many other students are in it, unnamed.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/LessonStatus"
        title:
          type: string
        tutors:
          type: array
          items:
            type: string
        location:
          $ref: "#/components/schemas/LessonLocation"
        cancellation:
          $ref: "#/components/schemas/Cancellation"
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyLessonItem"

    FamilyLessonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyLesson"

    FamilyPaymentRequest:
      allOf:
        - $ref: "#/components/schemas/PublicPaymentRequest"
        - type: object
          required: [id, student, createdAt]
          properties:
            id:
              type: string
              format: uuid
            student:
              $ref: "#/components/schemas/StudentRef"
            createdAt:
              type: string
              format: date-time
            receipt:
              $ref: "#/components/schemas/ReceiptRef"

    FamilyPaymentRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyPaymentRequest"

    MembershipRole:
      type: string
      description: Student and parent are reserved and carry no capabilities yet.
      enum: [owner, teacher, student, parent]

    Capability:
      type: string
      description: One row of the authorization matrix in docs/architecture.md.
      enum:
        - view_own_lessons
        - view_team_timetable
        - manage_team
        - manage_lessons
        - reassign_lessons
        - complete_own_lessons
        - edit_own_lesson_items
        - manage_students
        - view_own_students
        - manage_payments
        - manage_own_payments
        - view_linked_lessons
        - view_linked_payments

security:
  - firebaseIdToken: []
