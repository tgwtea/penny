apiVersion: apps/v1
kind: Deployment
metadata:
  name: penny-api
  labels:
    app.kubernetes.io/name: penny-api
    app.kubernetes.io/component: api
  annotations:
    # Roll out only after the database (wave -1) exists and the migrate
    # Job (wave 0) has succeeded.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: penny-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penny-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: penny
    spec:
      serviceAccountName: penny-api
      automountServiceAccountToken: false
      # preStop sleep (5s) + PENNY_SHUTDOWN_TIMEOUT (20s) + margin.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: penny-api
      containers:
        - name: api
          image: ghcr.io/tgwtea/penny-api
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            # The user and password come from PGUSER and PGPASSWORD, so the
            # password never needs URL-encoding. The CA is the one
            # CloudNativePG issued, so the server's identity is verified.
            - name: PENNY_DATABASE_URL
              value: postgres://penny-db-rw:5432/penny?sslmode=verify-full&sslrootcert=/etc/penny/db-ca/ca.crt
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: penny-app-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: penny-app-db
                  key: password
            - name: PENNY_SHUTDOWN_TIMEOUT
              value: 20s
            # Overlays set this to the web client's origin.
            - name: PENNY_CORS_ORIGINS
              value: ""
            # Overlays set this to the environment's Firebase project
            # (docs/runbooks/firebase-auth-setup.md). Empty fails startup.
            - name: PENNY_FIREBASE_PROJECT_ID
              value: ""
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Keep serving while the pod is removed from the Service's
            # endpoints, so no request reaches a pod that stopped listening.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-ca
              mountPath: /etc/penny/db-ca
              readOnly: true
      volumes:
        - name: db-ca
          secret:
            # Created by CloudNativePG for the penny-db cluster.
            secretName: penny-db-ca
            items:
              - key: ca.crt
                path: ca.crt
