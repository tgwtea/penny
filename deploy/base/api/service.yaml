apiVersion: v1
kind: Service
metadata:
  name: penny-api
  labels:
    app.kubernetes.io/name: penny-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: penny-api
  ports:
    - name: http
      port: 80
      targetPort: http
    # Scraped by Prometheus inside the cluster. The ingress never routes it.
    - name: metrics
      port: 9090
      targetPort: metrics
