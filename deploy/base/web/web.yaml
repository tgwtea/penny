# The web client: static files from nginx. It needs no secrets and no
# database; PENNY_API_URL tells the app where the API is (set per overlay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penny-web
  labels:
    app.kubernetes.io/name: penny-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: penny-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penny-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: penny
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: penny-web
      containers:
        - name: web
          image: ghcr.io/tgwtea/penny-web
          ports:
            - name: http
              containerPort: 8080
          env:
            # Overlays set this to the API's public URL.
            - name: PENNY_API_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its rendered config, pid and temporary files here.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: penny-web
  labels:
    app.kubernetes.io/name: penny-web
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: penny-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: penny-web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: penny-web
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: penny-web
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      # Overlays replace the host.
      match: Host(`app.penny.invalid`)
      services:
        - name: penny-web
          port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: penny-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
