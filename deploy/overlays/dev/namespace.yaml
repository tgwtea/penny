apiVersion: v1
kind: Namespace
metadata:
  name: penny-dev
  labels:
    # Every Penny workload meets the restricted profile; enforcing baseline
    # keeps operator-managed pods (CloudNativePG) from being rejected if a
    # future version adds something restricted forbids.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
