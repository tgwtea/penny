# One entry point for local work and CI. CI jobs call these tasks, so a
# green `task lint test` locally means the same checks pass in CI.

version: "3"

output: prefixed
silent: true

vars:
  API_DIR: services/api
  CLIENT_DIR: apps/client
  UI_DIR: packages/penny_ui
  CATALOGUE_DIR: packages/penny_ui/widgetbook
  # Dart packages formatted and analyzed with the client.
  DART_DIRS: apps/client packages/penny_ui packages/penny_api tools/checks tools/design tools/codegen
  # Matches compose.yaml. Set PENNY_POSTGRES_PORT if 5432 is taken locally.
  POSTGRES_PORT: '{{.PENNY_POSTGRES_PORT | default "5432"}}'
  LOCAL_DATABASE_URL: postgres://penny:penny@localhost:{{.POSTGRES_PORT}}/penny?sslmode=disable
  # Tool versions run through npx or go run, pinned here like .mise.toml.
  SPECTRAL_VERSION: 6.17.1
  OASDIFF_VERSION: v1.38.0
  GOVULNCHECK_VERSION: v1.9.0
  # The Linux Flutter image (the `sdk` stage of apps/client/Dockerfile).
  FLUTTER_IMAGE: penny-flutter:local
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the pinned toolchain from .mise.toml
    cmds:
      - mise install

  # Local services ----------------------------------------------------------

  dev:
    desc: Start Postgres (PostGIS), Mailpit and the Firebase Auth emulator
    cmds:
      - docker compose up --detach --build --wait

  dev:down:
    desc: Stop local services (data is kept)
    cmds:
      - docker compose down

  dev:reset:
    desc: Stop local services and delete their data
    prompt: This deletes the local database. Continue?
    cmds:
      - docker compose down --volumes

  dev:logs:
    desc: Follow logs from local services
    cmds:
      - docker compose logs --follow

  # Run ---------------------------------------------------------------------

  db:migrate:
    desc: Apply database migrations to the local database
    dir: "{{.API_DIR}}"
    env:
      PENNY_DATABASE_URL: '{{.PENNY_DATABASE_URL | default .LOCAL_DATABASE_URL}}'
      PENNY_LOG_FORMAT: text
    cmds:
      - go run ./cmd/migrate

  run:api:
    desc: Migrate the local database, then serve the API on http://localhost:8080
    dir: "{{.API_DIR}}"
    deps: [db:migrate]
    env:
      PENNY_DATABASE_URL: '{{.PENNY_DATABASE_URL | default .LOCAL_DATABASE_URL}}'
      PENNY_LOG_FORMAT: text
      PENNY_LOG_LEVEL: debug
      # The web client under `task run:client:web` (port 5173).
      PENNY_CORS_ORIGINS: '{{.PENNY_CORS_ORIGINS | default "http://localhost:5173"}}'
    cmds:
      - go run ./cmd/api

  run:client:
    desc: Run the client on demo data (pass a device after --, for example -- -d windows)
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - flutter run --dart-define=PENNY_BACKEND=demo {{.CLI_ARGS}}

  run:client:web:
    desc: Run the client in Chrome against the local API (task run:api)
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - flutter run -d chrome --web-port 5173 --dart-define=PENNY_BACKEND=http --dart-define=PENNY_API_URL=http://localhost:8080

  ui:catalogue:
    desc: Open the penny_ui Widgetbook catalogue in Chrome
    dir: "{{.CATALOGUE_DIR}}"
    cmds:
      - flutter run -d chrome

  # Lint --------------------------------------------------------------------

  lint:
    desc: Lint everything
    deps: [lint:repo, lint:contract, lint:api, lint:client, lint:deploy]

  lint:repo:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  lint:contract:
    desc: Lint the API contract and check it for breaking changes against main
    cmds:
      - npx --yes @stoplight/spectral-cli@{{.SPECTRAL_VERSION}} lint api/openapi.yaml --ruleset api/.spectral.yaml --fail-severity warn
      - task: contract:breaking

  contract:breaking:
    desc: Fail if api/openapi.yaml breaks clients of the version on main
    vars:
      BASE: .task/openapi-main.yaml
    cmds:
      - mkdir -p .task
      - |
        if ! git show origin/main:api/openapi.yaml > {{.BASE}} 2>/dev/null; then
          echo "skipped: origin/main has no api/openapi.yaml yet"
          exit 0
        fi
        go run github.com/oasdiff/oasdiff@{{.OASDIFF_VERSION}} breaking {{.BASE}} api/openapi.yaml --fail-on ERR

  lint:api:
    desc: Lint the Go service
    dir: "{{.API_DIR}}"
    cmds:
      - golangci-lint run ./...

  lint:client:
    desc: Format-check and analyze the client, penny_ui, the catalogue and the Dart tools; check layering and design tokens
    deps: [pub:get]
    cmds:
      - dart format --output=none --set-exit-if-changed {{.DART_DIRS}} {{.CATALOGUE_DIR}}
      - for: [apps/client, packages/penny_ui, packages/penny_ui/widgetbook]
        cmd: cd {{.ITEM}} && flutter analyze
      - for: [tools/checks, tools/design]
        cmd: cd {{.ITEM}} && dart analyze --fatal-infos
      - cd tools/checks && dart run bin/check_client.dart

  lint:deploy:
    desc: Render every Kustomize overlay and validate it against Kubernetes and CRD schemas
    vars:
      # Custom resources (CloudNativePG, Traefik, Prometheus, Sealed Secrets,
      # ArgoCD) are validated against the community CRD catalog.
      KUBECONFORM: >-
        kubeconform -strict -summary
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json'
    cmds:
      - |
        for overlay in deploy/overlays/*/; do
          echo "validating ${overlay}"
          kustomize build "${overlay}" | {{.KUBECONFORM}}
        done
        echo "validating deploy/argocd"
        {{.KUBECONFORM}} deploy/argocd

  vuln:api:
    desc: Report known vulnerabilities in the Go service's dependencies
    dir: "{{.API_DIR}}"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  # Test --------------------------------------------------------------------

  test:
    desc: Run every component's tests
    deps: [test:api, test:client]

  test:api:
    desc: Run Go tests with the race detector (database tests need PENNY_TEST_DATABASE_URL)
    dir: "{{.API_DIR}}"
    cmds:
      - go test -race ./...

  test:client:
    desc: Run the client, penny_ui and Dart tool tests (golden images only on Linux; see test:goldens)
    deps: [pub:get]
    cmds:
      - for: [apps/client, packages/penny_ui]
        cmd: cd {{.ITEM}} && flutter test
      - for: [tools/checks, tools/design]
        cmd: cd {{.ITEM}} && dart test

  flutter:image:
    desc: Build the Linux Flutter image used for golden images
    internal: true
    cmds:
      - docker build --quiet --target sdk --tag {{.FLUTTER_IMAGE}} --file apps/client/Dockerfile apps/client
    sources:
      - apps/client/Dockerfile

  test:goldens:
    desc: Compare penny_ui golden images on Linux, from any machine (needs Docker)
    deps: [flutter:image]
    cmds:
      - task: goldens
        vars: { FLAGS: "" }

  test:goldens:update:
    desc: Re-render penny_ui golden images on Linux after an intended visual change (needs Docker)
    deps: [flutter:image]
    cmds:
      - task: goldens
        vars: { FLAGS: "--update-goldens" }

  goldens:
    internal: true
    cmds:
      # Runs on a copy inside the container, so the host's .dart_tool is left
      # alone; only the golden images are copied back.
      - >-
        docker run --rm
        {{if ne OS "windows"}}--user "$(id -u):$(id -g)" --env HOME=/tmp{{end}}
        --volume "{{.ROOT_DIR}}/packages:/src/packages"
        {{.FLUTTER_IMAGE}}
        sh -c 'cp -r /src/packages /tmp/packages
        && cd /tmp/packages/penny_ui
        && flutter pub get
        && flutter test --tags golden {{.FLAGS}}
        && cp -r test/goldens/. /src/packages/penny_ui/test/goldens/'

  # Build -------------------------------------------------------------------

  build:web:
    desc: Build the web client as the image does (HTTP backend, no CDN)
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - flutter build web --release --no-web-resources-cdn --dart-define=PENNY_BACKEND=http

  build:images:
    desc: Build the api and web container images locally
    cmds:
      - docker build --tag penny-api:local {{.API_DIR}}
      - docker build --tag penny-web:local --file {{.CLIENT_DIR}}/Dockerfile .

  # Code generation -----------------------------------------------------------

  pub:get:
    desc: Fetch Dart and Flutter dependencies for every package
    internal: true
    cmds:
      - for: [apps/client, packages/penny_ui, packages/penny_ui/widgetbook]
        cmd: cd {{.ITEM}} && flutter pub get
      # packages/penny_api is pure Dart. Its dependencies must be fetched too,
      # or `dart format` cannot read its analysis options and formats it with
      # the wrong language version.
      - for: [packages/penny_api, tools/checks, tools/design, tools/codegen]
        cmd: cd {{.ITEM}} && dart pub get

  gen:
    desc: Regenerate everything generated from a source in this repository
    cmds:
      - task: gen:api
      - task: gen:dart
      - task: gen:tokens

  gen:api:
    desc: Regenerate the Go server, models and test client from api/openapi.yaml
    dir: "{{.API_DIR}}"
    cmds:
      - go generate ./internal/httpapi/...

  gen:dart:
    desc: Regenerate packages/penny_api from api/openapi.yaml (space_gen, ADR 022)
    dir: tools/codegen
    cmds:
      - dart pub get
      - dart run space_gen -i ../../api/openapi.yaml -o ../../packages/penny_api

  gen:tokens:
    desc: Regenerate penny_ui's tokens.g.dart from docs/design/tokens.json
    dir: tools/design
    cmds:
      - dart pub get
      - dart run bin/generate_tokens.dart
      - dart format ../../packages/penny_ui/lib/src/tokens.g.dart

  gen:icons:
    desc: Re-render the pixel-art app icon and every platform icon from tools/brand/penny_icon.py
    cmds:
      - "{{.PYTHON}} tools/brand/penny_icon.py apps/client/assets/brand"
      - cd {{.CLIENT_DIR}} && dart run flutter_launcher_icons

  gen:check:
    desc: Fail if committed generated code differs from a fresh generation
    cmds:
      - task: gen
      - |
        changes="$(git status --porcelain -- packages/penny_api services/api/internal/httpapi/gen packages/penny_ui/lib/src/tokens.g.dart)"
        if [ -n "${changes}" ]; then
          echo "Generated code is stale. Run 'task gen' and commit the result:"
          echo "${changes}"
          exit 1
        fi
