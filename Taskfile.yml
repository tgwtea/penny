# One entry point for local work and CI. CI jobs call these tasks, so a
# green `task lint test` locally means the same checks pass in CI.
#
# Component tasks skip with a message until that component exists, so the
# same commands work in every phase without edits.

version: "3"

output: prefixed
silent: true

vars:
  API_DIR: services/api
  CLIENT_DIR: apps/client
  # Matches compose.yaml. Set PENNY_POSTGRES_PORT if 5432 is taken locally.
  POSTGRES_PORT: '{{.PENNY_POSTGRES_PORT | default "5432"}}'
  LOCAL_DATABASE_URL: postgres://penny:penny@localhost:{{.POSTGRES_PORT}}/penny?sslmode=disable
  # Tool versions run through npx or go run, pinned here like .mise.toml.
  SPECTRAL_VERSION: 6.17.1
  OASDIFF_VERSION: v1.38.0
  GOVULNCHECK_VERSION: v1.9.0

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the pinned toolchain from .mise.toml
    cmds:
      - mise install

  # Local services ----------------------------------------------------------

  dev:
    desc: Start Postgres (PostGIS), Mailpit and the Firebase Auth emulator
    cmds:
      - docker compose up --detach --build --wait

  dev:down:
    desc: Stop local services (data is kept)
    cmds:
      - docker compose down

  dev:reset:
    desc: Stop local services and delete their data
    prompt: This deletes the local database. Continue?
    cmds:
      - docker compose down --volumes

  dev:logs:
    desc: Follow logs from local services
    cmds:
      - docker compose logs --follow

  # Run ---------------------------------------------------------------------

  db:migrate:
    desc: Apply database migrations to the local database
    dir: "{{.API_DIR}}"
    env:
      PENNY_DATABASE_URL: '{{.PENNY_DATABASE_URL | default .LOCAL_DATABASE_URL}}'
      PENNY_LOG_FORMAT: text
    cmds:
      - go run ./cmd/migrate

  run:api:
    desc: Migrate the local database, then serve the API on http://localhost:8080
    dir: "{{.API_DIR}}"
    deps: [db:migrate]
    env:
      PENNY_DATABASE_URL: '{{.PENNY_DATABASE_URL | default .LOCAL_DATABASE_URL}}'
      PENNY_LOG_FORMAT: text
      PENNY_LOG_LEVEL: debug
      # flutter run -d chrome --web-port 5173 (see apps/client/README.md)
      PENNY_CORS_ORIGINS: '{{.PENNY_CORS_ORIGINS | default "http://localhost:5173"}}'
    cmds:
      - go run ./cmd/api

  # Lint --------------------------------------------------------------------

  lint:
    desc: Lint everything
    deps: [lint:repo, lint:contract, lint:api, lint:client, lint:deploy]

  lint:repo:
    desc: Lint GitHub Actions workflows
    cmds:
      - actionlint

  lint:contract:
    desc: Lint the API contract and check it for breaking changes against main
    cmds:
      - npx --yes @stoplight/spectral-cli@{{.SPECTRAL_VERSION}} lint api/openapi.yaml --ruleset api/.spectral.yaml --fail-severity warn
      - task: contract:breaking

  contract:breaking:
    desc: Fail if api/openapi.yaml breaks clients of the version on main
    vars:
      BASE: .task/openapi-main.yaml
    cmds:
      - mkdir -p .task
      - |
        if ! git show origin/main:api/openapi.yaml > {{.BASE}} 2>/dev/null; then
          echo "skipped: origin/main has no api/openapi.yaml yet"
          exit 0
        fi
        go run github.com/oasdiff/oasdiff@{{.OASDIFF_VERSION}} breaking {{.BASE}} api/openapi.yaml --fail-on ERR

  lint:api:
    desc: Lint the Go service
    dir: "{{.API_DIR}}"
    cmds:
      - |
        if [ ! -f go.mod ]; then echo "skipped: {{.API_DIR}} has no go.mod yet"; exit 0; fi
        golangci-lint run ./...

  lint:client:
    desc: Format-check and analyze the Flutter client
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - |
        if [ ! -f pubspec.yaml ]; then echo "skipped: {{.CLIENT_DIR}} has no pubspec.yaml yet (Phase 2)"; exit 0; fi
        dart format --output=none --set-exit-if-changed .
        flutter analyze

  lint:deploy:
    desc: Render every Kustomize overlay and validate it against Kubernetes schemas
    cmds:
      - |
        if [ ! -f deploy/base/kustomization.yaml ]; then echo "skipped: deploy/base has no kustomization.yaml yet"; exit 0; fi
        for overlay in deploy/overlays/*/; do
          echo "validating ${overlay}"
          kustomize build "${overlay}" | kubeconform -strict -summary -ignore-missing-schemas
        done

  vuln:api:
    desc: Report known vulnerabilities in the Go service's dependencies
    dir: "{{.API_DIR}}"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  # Test --------------------------------------------------------------------

  test:
    desc: Run every component's tests
    deps: [test:api, test:client]

  test:api:
    desc: Run Go tests with the race detector (database tests need PENNY_TEST_DATABASE_URL)
    dir: "{{.API_DIR}}"
    cmds:
      - |
        if [ ! -f go.mod ]; then echo "skipped: {{.API_DIR}} has no go.mod yet"; exit 0; fi
        go test -race ./...

  test:client:
    desc: Run Flutter tests
    dir: "{{.CLIENT_DIR}}"
    cmds:
      - |
        if [ ! -f pubspec.yaml ]; then echo "skipped: {{.CLIENT_DIR}} has no pubspec.yaml yet (Phase 2)"; exit 0; fi
        flutter test

  # Code generation -----------------------------------------------------------

  gen:
    desc: Regenerate code from its sources (the API contract)
    cmds:
      - task: gen:api

  gen:api:
    desc: Regenerate the Go server, models and test client from api/openapi.yaml
    dir: "{{.API_DIR}}"
    cmds:
      - go generate ./internal/httpapi/...

  gen:check:
    desc: Fail if committed generated code differs from a fresh generation
    cmds:
      - task: gen
      - |
        changes="$(git status --porcelain -- packages/penny_api services/api/internal/httpapi/gen)"
        if [ -n "${changes}" ]; then
          echo "Generated code is stale. Run 'task gen' and commit the result:"
          echo "${changes}"
          exit 1
        fi
