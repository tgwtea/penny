name: penny_ui
description: Penny's design system for Flutter. Tokens, theme and components (ADR 016, ADR 020).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # For lib/testing.dart only, which apps import from their tests.
  flutter_test:
    sdk: flutter
  intl: ^0.20.2
  # QR code encoding for PennyQrCode (pure Dart, no platform code); drawing
  # stays ours, in penny_ui's colours.
  qr: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # IBM Plex Sans 400, 400 italic and 600 (SIL Open Font License, fonts/OFL.txt).
  # Bundled: Penny never fetches fonts at runtime.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    # Phosphor Icons 2.1, Regular and Fill (MIT, fonts/Phosphor-LICENSE.txt),
    # from the official @phosphor-icons/web release (ADR 021).
    - family: Phosphor
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: Phosphor Fill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf
