# sqlc: SQL in db/queries/<module>/, typed Go out (ADR 005).
# Regenerate with `task gen`; never edit the generated packages by hand.
#
# Each module gets its own generated package, imported only by that module's
# store, so no module can read another module's tables (ADR 002). To add a
# module, copy an entry under `sql:` and merge the shared options with
# `<<: *go`.
version: "2"

# Type mappings shared by every module.
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: citext
        go_type: string
      - db_type: citext
        nullable: true
        go_type:
          type: string
          pointer: true

sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity
    gen:
      go: &go
        package: identitysql
        out: internal/identity/identitysql
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        omit_unused_structs: true
